name: Build Android APK

# Gera o APK do Solut_Arquive automaticamente a cada push na branch principal,
# em pull requests, ou manualmente pela aba "Actions" do GitHub.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar projeto Capacitor (copia www/ para o Android)
        run: npx cap sync android

      - name: Tornar o gradlew executável
        run: chmod +x android/gradlew

      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: solut-arquive-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-release:
    name: Build release APK (não assinado)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar projeto Capacitor
        run: npx cap sync android

      - name: Tornar o gradlew executável
        run: chmod +x android/gradlew

      - name: Compilar APK de release (não assinado)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publicar APK release como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: solut-arquive-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
